<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - Leadership · Jevan Hava</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --navy:#0f2d52; --gold:#b8832e; --muted:#64748b; --border:#e2dfd9; --bg:#ffffff; --r:12px; }
    body { background:var(--bg); color:#111; font-family:'Jost',sans-serif; font-size:16px; line-height:1.65; }
    .g-nav { padding:1.2rem 3rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .g-back { font-size:.8rem; color:var(--gold); font-weight:600; text-decoration:none; letter-spacing:.06em; }
    .g-back:hover { text-decoration:underline; }
    .g-site-name { font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--navy); font-weight:600; }
    .g-header { padding:3rem 3rem 2rem; border-bottom:1px solid var(--border); }
    .g-label { font-size:.68rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
    .g-title { font-family:'Cormorant Garamond',serif; font-size:2.5rem; font-weight:700; color:var(--navy); line-height:1.1; }
    .g-dates { font-size:.82rem; color:var(--muted); margin-top:.5rem; }
    .g-content { padding:2.5rem 3rem; max-width:1100px; margin:0 auto; }
    .g-placeholder { border:2px dashed #cccccc; border-radius:var(--r); padding:4rem 2rem; text-align:center; color:#999; font-size:.88rem; }
    .g-placeholder p { margin-bottom:.5rem; }
    .g-placeholder small { font-size:.73rem; color:#bbb; }
    @media(max-width:600px) { .g-nav,.g-header,.g-content { padding-left:1.2rem; padding-right:1.2rem; } .g-title { font-size:1.8rem; } }
  </style>
</head>
<body>
<nav class="g-nav">
  <a class="g-back" href="./">&#8592; Back to Portofolio</a>
  <span class="g-site-name">Jevan Hava Maula Ihsan</span>
</nav>
<div class="g-header">
  <div class="g-label">Leadership</div>
  <div class="g-title">Leadership Roles</div>
  <div class="g-dates">SCMF · ACE UTM · DEMA · Permika Toronto</div>
</div>
<div class="g-content">
  <div class="g-placeholder">
    <p>Content will be available soon.</p>
    <small>Photos, certificates, and documents will appear here once uploaded.</small>
  </div>
</div>
</body>
</html>
